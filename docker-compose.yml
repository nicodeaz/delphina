# Production (OVH VPS). Only reachable locally; Cloudflare Tunnel maps
# nailsbydelphina.okto.ie -> http://localhost:8081.
services:
  delphina:
    build: .
    image: delphina
    container_name: delphina
    restart: unless-stopped
    env_file: .env
    environment:
      DB_CONNECTION: sqlite
      DB_DATABASE: /data/database.sqlite
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - ./data:/data
      - ./logs:/var/www/html/storage/logs
