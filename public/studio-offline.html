<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#554F13">
    <meta name="robots" content="noindex, nofollow">
    <title>No connection · Delphina Studio</title>
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box;
               background: #f7f5ee; color: #2F2A09; font-family: -apple-system, BlinkMacSystemFont, 'Poppins', Helvetica, Arial, sans-serif; text-align: center; }
        main { max-width: 320px; }
        .icon { width: 72px; height: 72px; margin: 0 auto; border-radius: 18px; background: #554F13; display: flex; align-items: center; justify-content: center; }
        h1 { margin: 20px 0 8px; font-size: 22px; }
        p { margin: 0 0 24px; font-size: 15px; line-height: 1.5; color: #5E5720; }
        button { width: 100%; padding: 14px; border: 0; border-radius: 16px; background: #554F13; color: #fff; font: inherit; font-weight: 600; font-size: 16px; }
    </style>
</head>
<body>
    <main>
        <!-- No images: this page is shown at the URL of whatever page failed, so relative paths wouldn't resolve. -->
        <div class="icon" aria-hidden="true">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#f7f3e8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 2l20 20"/><path d="M8.5 16.5a5 5 0 0 1 7 0"/><path d="M5 12.86a10 10 0 0 1 5.17-2.69"/><path d="M19 12.86a10 10 0 0 0-2.01-1.53"/><path d="M2 8.82a15 15 0 0 1 4.17-2.65"/><path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76"/><circle cx="12" cy="20" r="0.5" fill="#f7f3e8"/>
            </svg>
        </div>
        <h1>No connection</h1>
        <p>Your agenda needs the internet to stay up to date. Check your Wi-Fi or mobile data and try again.</p>
        <button type="button" onclick="location.reload()">Try again</button>
    </main>
</body>
</html>
